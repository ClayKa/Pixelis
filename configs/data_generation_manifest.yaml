# ====================================================================
# Section 2: Task Generation Configuration
# Aligned with actual task generator implementations
# ====================================================================
tasks:
  # --- Task 1: Detail Perception (ZOOM-IN) - 15,000 samples ---
  detail_perception_task:
    enabled: true
    task_generator_class: "DetailPerceptionTaskGenerator"
    target_sample_count: 15000
    source_datasets:
      - name: sa1b_for_zoomin
        weight: 0.45
      - name: flickr30k
        weight: 0.25
      - name: mind2web_train
        weight: 0.20
      - name: textcaps_train
        weight: 0.05
      - name: unsplash_lite
        weight: 0.05
    generator_config:
      difficulty_distribution:
        easy: 0.3
        medium: 0.5
        hard: 0.2
      use_mock_if_missing: true

  # --- Task 2: Frame Selection (SELECT-FRAME) - 15,000 samples ---
  select_frame_task:
    enabled: true
    task_generator_class: "SelectFrameTaskGenerator"
    target_sample_count: 20000
    source_datasets:
      - name: starqa_train
        weight: 0.40
      - name: didemo_train
        weight: 0.15
      - name: msrvtt_train
        weight: 0.20
      - name: activitynet_captions_train
        weight: 0.15
      - name: assembly101_train
        weight: 0.10
    generator_config:
      max_frames_per_video: 100
      frame_sampling_rate: 5

  # --- Task 3: Geometric Comparison (SEGMENT + PROPERTIES) - 25,000 samples ---
  geometric_comparison_task:
    enabled: true
    task_generator_class: "GeometricComparisonTaskGenerator"
    target_sample_count: 25000
    source_datasets:
      - name: coco2017_train
        weight: 0.40
      - name: lvis_v1_train
        weight: 0.30
      - name: sa1b_for_segmentation
        weight: 0.20
      - name: part_imagenet_train
        weight: 0.10
    generator_config:
      min_objects_per_image: 2
      max_objects_per_image: 10
      property_types: ["area", "perimeter", "centroid", "bbox", "aspect_ratio"]

  # --- Task 4: Targeted OCR (READ-TEXT) - 20,000 samples ---
  targeted_ocr_task:
    enabled: true
    task_generator_class: "TargetedOCRTaskGenerator"
    target_sample_count: 20000
    source_datasets:
      - name: infographics_vqa_train
        weight: 0.30
      - name: docvqa_train
        weight: 0.30
      - name: hiertext_train
        weight: 0.20
      - name: icdar_2019_art_train
        weight: 0.20
    generator_config:
      ocr_confidence_threshold: 0.7
      min_text_regions: 1
      max_text_regions: 20

  # --- Task 5: Spatio-Temporal Analysis (TRACK-OBJECT) - 25,000 samples ---
  spatiotemporal_task:
    enabled: true
    task_generator_class: "SpatioTemporalTaskGenerator"
    target_sample_count: 30000
    source_datasets:
      - name: mot20_train
        weight: 0.15
      - name: uvo_dense_train
        weight: 0.35
      - name: epic_kitchens_visor_train
        weight: 0.30
      - name: vis2022_train
        weight: 0.20
    generator_config:
      min_track_length: 10
      max_track_length: 300
      sampling_strategy: "sliding_window"

# ====================================================================
# Section 3: Trajectory Augmentation Strategy
# ====================================================================
trajectory_augmentation:
  enabled: true
  proportions:
    golden_positive: 0.60  # Standard correct trajectories
    trap_samples: 0.20     # Process-negative with subtle errors
    self_correction: 0.20  # Self-correcting trajectories
  
  trap_generation:
    error_types:
      - "incorrect_coordinates"
      - "wrong_operation_order"
      - "misidentified_object"
      - "calculation_error"
    error_injection_rate: 0.3
    
  self_correction:
    correction_triggers:
      - "unexpected_result"
      - "consistency_check_failed"
      - "confidence_below_threshold"
    correction_strategies:
      - "retry_with_different_parameters"
      - "use_alternative_operation"
      - "refine_previous_step"

# ====================================================================
# Section 4: Global Configuration
# ====================================================================
global_config:
  # Output configuration
  output_dir: "data_outputs/specialized/"
  checkpoint_every_n_samples: 250
  save_intermediate_results: true
  
  # Data loading configuration
  data_loading:
    num_workers: 4
    prefetch_samples: 100
    cache_size: 1000
    use_memory_mapping: true  # For large datasets like SA1B
    
  # API configuration for generation
  api_profiles:
    generator_api:
      provider: "openrouter"
      model: "meta-llama/llama-3.3-8b-instruct:free"
      api_base_url: "https://openrouter.ai/api/v1"
      api_key_env_variable: "OPENROUTER_API_KEY"
      max_tokens: 2048
      temperature: 0.7
      retry_attempts: 3
      timeout_seconds: 30
    
    scorer_api:
      provider: "openrouter"
      model: "qwen/qwen3-235b-a22b:free"
      api_base_url: "https://openrouter.ai/api/v1"
      api_key_env_variable: "OPENROUTER_API_KEY"
      max_tokens: 1024
      temperature: 0.3
  
  # Quality control
  quality_control:
    min_trajectory_quality_score: 0.7
    min_thought_steps: 3
    min_visual_operations: 2
    max_visual_operations: 15
    validate_json_structure: true
    check_operation_consistency: true
    
  # Performance optimization
  optimization:
    use_batch_generation: true
    batch_size: 10
    parallel_workers: 4
    gpu_acceleration: true
    mixed_precision: true
    
  # Logging and monitoring
  logging:
    level: "INFO"
    log_to_file: true
    log_file_path: "logs/data_generation.log"
    log_to_wandb: false
    wandb_project: "pixelis-data-generation"
    
  # Error handling
  error_handling:
    skip_on_error: true
    max_consecutive_errors: 10
    error_recovery_strategy: "retry_with_backoff"
    save_error_samples: true
    error_log_path: "logs/generation_errors.log"

# ====================================================================
# Section 5: Validation Rules
# ====================================================================
validation:
  # Dataset validation
  dataset_checks:
    - check_file_existence: true
    - verify_image_integrity: true
    - validate_annotation_format: true
    - check_video_codecs: true
    - verify_ocr_alignment: true
    
  # Trajectory validation
  trajectory_checks:
    - validate_json_schema: true
    - check_thought_coherence: true
    - verify_operation_sequence: true
    - validate_coordinate_bounds: true
    - check_answer_completeness: true
    
  # Output validation
  output_checks:
    - verify_sample_counts: true
    - check_distribution_balance: true
    - validate_augmentation_ratios: true
    - ensure_unique_ids: true
    - check_quality_scores: true